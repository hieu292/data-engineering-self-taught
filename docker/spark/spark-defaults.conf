# ═══════════════════════════════════════════════════════════════
#  Cấu hình mặc định cho MỌI tiến trình Spark trong stack.
#  Databricks giấu file này sau UI "Cluster settings" — ở đây ta nhìn thẳng vào nó.
# ═══════════════════════════════════════════════════════════════

# ── Nói chuyện với MinIO qua giao thức S3A ─────────────────────
# s3a:// là cài đặt S3 client của Hadoop. DuckDB ở Phase 0-2 tự nói S3,
# còn Spark thì đi qua tầng này — nên mới cần hadoop-aws + AWS SDK.
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.endpoint.region          us-east-1
spark.hadoop.fs.s3a.connection.ssl.enabled   false

# Phase 6: Unity Catalog từ chối LOCATION khai `s3a://` (validate lúc tạo
# bảng, `Unsupported URI scheme: s3a`) — nó nghĩ theo kiểu AWS thật, chỉ nhận
# `s3://`. Đăng ký ĐÚNG S3AFileSystem cho cả hai scheme để Spark vẫn đọc/ghi
# MinIO bình thường dù URI viết là `s3://`. Xem docs.unitycatalog.io — chính
# tài liệu Spark integration của UC cũng khai dòng này, không phải suy đoán.
spark.hadoop.fs.s3.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem

# BẮT BUỘC với MinIO. AWS thật dùng virtual-host style: bucket.s3.amazonaws.com.
# MinIO dùng path style: minio:9000/bucket. Thiếu dòng này là lỗi DNS khó hiểu.
spark.hadoop.fs.s3a.path.style.access        true

# Không hardcode key. Provider này đọc AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# từ biến môi trường — cùng bộ biến docker-compose đã cấp từ Phase 0.
#
# Phase 6: thêm TemporaryAWSCredentialsProvider ở ĐẦU danh sách — Unity
# Catalog tự vend credential tạm thời (access+secret+session token) cho mỗi
# bảng EXTERNAL nó tạo qua Spark, gắn theo TỪNG ĐƯỜNG DẪN (per-bucket Hadoop
# config), không phải biến môi trường toàn cục. Không thử provider này trước,
# Spark bỏ qua thẳng credential UC vừa vend và dùng credential MinIO tĩnh —
# đúng cách UC KHÔNG kiểm soát được ai đọc/ghi bảng gì (toàn bộ lý do phân
# quyền tồn tại). Fallback EnvironmentVariableCredentialsProvider giữ lại cho
# đường dẫn KHÔNG qua Unity Catalog (vd `raw/` — script ingest đọc thẳng).
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.TemporaryAWSCredentialsProvider,software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider

# ── Delta Lake: cắm vào Spark bằng hai móc mở rộng ─────────────
# extensions  → dạy Catalyst các câu lệnh MERGE / OPTIMIZE / VACUUM / RESTORE
# catalog     → dạy Spark rằng "bảng" có thể là một thư mục Delta
# Đây chính là cách Delta là "định dạng mở": nó là plugin, không phải bản vá Spark.
spark.sql.extensions                         io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog              org.apache.spark.sql.delta.catalog.DeltaCatalog

# Delta Connect: cầu nối để client sc:// gọi được API Delta, không chỉ SQL.
spark.connect.extensions.relation.classes    org.apache.spark.sql.connect.delta.DeltaRelationPlugin
spark.connect.extensions.command.classes     org.apache.spark.sql.connect.delta.DeltaCommandPlugin

# ── Kích thước executor ────────────────────────────────────────
# Mỗi worker có 2 core → mỗi worker đẻ ĐÚNG 1 executor 2 core.
# Tổng cộng: 2 executor, 4 task chạy song song. Con số nhỏ là cố ý —
# đủ để shuffle phải đi qua network thật, và đủ nhỏ để nhìn thấy
# một task lệch (skew) treo trong khi ba task kia đã rảnh.
#
# NGÂN SÁCH RAM — con số này bị chặn bởi Docker Desktop, không phải bởi máy.
# Máy có 32GB nhưng Docker VM mặc định chỉ được cấp ~8GB. Đặt 2 executor × 3g
# + driver 2g = 8g là vượt trần, và kernel giết executor bằng SIGKILL:
# trong log hiện "exited with code 137", còn Spark chỉ báo một lỗi rất khó hiểu
# là "MetadataFetchFailedException: Missing an output location for shuffle".
# Đó là một sự cố production kinh điển — lỗi hiện ra ở tầng shuffle, nhưng
# nguyên nhân nằm ở tầng hệ điều hành.
#   2 × 2g + 1g = 5g, chừa chỗ cho Python worker, MinIO và Jupyter.
# Muốn chạy rộng tay hơn: Docker Desktop → Settings → Resources → Memory.
spark.executor.cores                         2
spark.executor.memory                        2g
spark.driver.memory                          1g

# ── Chừa chỗ cho bài học ───────────────────────────────────────
# 200 là mặc định của Spark — CỐ Ý không sửa. Với 4 core, 200 partition
# shuffle là quá nhiều; notebook Phase 3 sẽ tự đo rồi tự chỉnh.
spark.sql.shuffle.partitions                 200

# ── Catalog mặc định — nơi dbt/pipeline THẬT đọc-ghi bảng ───────
#
# Đến Phase 3, mọi thứ đều là ĐƯỜNG DẪN: spark.read.format("delta").load("s3a://...").
# Từ Phase 4, dbt cần gọi bảng bằng TÊN (`silver.trips`) và phải hỏi được
# "bảng này đã tồn tại chưa?" — nếu không, model incremental không thể có.
#
# Phase 4 dùng Derby NHÚNG ngay trong JVM này (một tiến trình mở được).
# Phase 5 tách ra Hive Metastore ĐỘC LẬP (Thrift + Postgres) — một service
# thật, Spark và Trino cùng trỏ vào. Phase 6 GIỮ NGUYÊN khối này — không phải
# vì lười, mà vì thử thay hẳn bằng Unity Catalog rồi thấy vỡ thật (xem khối
# `spark.sql.catalog.unity.*` ngay dưới và docs/roadmap.md Phần 9).
spark.sql.catalogImplementation                  hive
spark.sql.warehouse.dir                          s3a://lakehouse/warehouse
spark.hadoop.hive.metastore.uris                 thrift://hive-metastore:9083

# ── Unity Catalog — catalog THỨ HAI, chỉ để xem metadata ────────
#
# `unity` không phải kiểu catalog dựng sẵn của Spark (`hive` / `in-memory`)
# mà là một CATALOG PLUGIN — io.unitycatalog.spark.UCSingleCatalog implement
# thẳng Spark TableCatalog SPI, dịch lệnh SQL thành lời gọi REST tới Unity
# Catalog server. `SHOW SCHEMAS FROM unity` / `SHOW TABLES FROM unity.gold`
# chạy tốt — chỉ hỏi METADATA, Unity Catalog trả lời thẳng.
#
# `SELECT`/`CREATE`/`INSERT` qua `unity.*` thì KHÔNG — plugin này luôn gọi
# `generateTemporaryPathCredentials` để xin Unity Catalog vend credential
# S3 tạm thời cho MỌI thao tác chạm dữ liệu, không có cờ nào tắt được (đã
# đọc thẳng mã nguồn UCSingleCatalog.scala để chắc). Bản UC OSS phát hành
# chính thức (v0.6.0) CHƯA hỗ trợ custom S3 endpoint (MinIO) trong luồng
# vend đó — MinIO từ chối token giả với "InvalidTokenId" khi đã kiểm bằng
# tay. Đây chính là bước "sai có chủ đích" của Phase 6: tự tay thử
# `spark.sql("SELECT * FROM unity.gold.gold_daily_zone_revenue")` trong
# notebook, xem lỗi thật, rồi hiểu vì sao — không phải bịa ra bài học.
#
# Không set `spark.sql.defaultCatalog=unity`: pipeline thật (dbt, ingest)
# vẫn dùng tên bảng KHÔNG tiền tố như mọi phase trước, tự động vào catalog
# `spark_catalog` (Hive Metastore) ở trên — muốn xem qua Unity Catalog phải
# gõ rõ `unity.<schema>.<table>`.
spark.sql.catalog.unity                          io.unitycatalog.spark.UCSingleCatalog
spark.sql.catalog.unity.uri                       http://unity-catalog:8080
