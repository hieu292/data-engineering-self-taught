# ═══════════════════════════════════════════════════════════════
#  Cấu hình mặc định cho MỌI tiến trình Spark trong stack.
#  Databricks giấu file này sau UI "Cluster settings" — ở đây ta nhìn thẳng vào nó.
# ═══════════════════════════════════════════════════════════════

# ── Nói chuyện với MinIO qua giao thức S3A ─────────────────────
# s3a:// là cài đặt S3 client của Hadoop. DuckDB ở Phase 0-2 tự nói S3,
# còn Spark thì đi qua tầng này — nên mới cần hadoop-aws + AWS SDK.
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.endpoint.region          us-east-1
spark.hadoop.fs.s3a.connection.ssl.enabled   false

# BẮT BUỘC với MinIO. AWS thật dùng virtual-host style: bucket.s3.amazonaws.com.
# MinIO dùng path style: minio:9000/bucket. Thiếu dòng này là lỗi DNS khó hiểu.
spark.hadoop.fs.s3a.path.style.access        true

# Không hardcode key. Provider này đọc AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# từ biến môi trường — cùng bộ biến docker-compose đã cấp từ Phase 0.
spark.hadoop.fs.s3a.aws.credentials.provider software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider

# ── Delta Lake: cắm vào Spark bằng hai móc mở rộng ─────────────
# extensions  → dạy Catalyst các câu lệnh MERGE / OPTIMIZE / VACUUM / RESTORE
# catalog     → dạy Spark rằng "bảng" có thể là một thư mục Delta
# Đây chính là cách Delta là "định dạng mở": nó là plugin, không phải bản vá Spark.
spark.sql.extensions                         io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog              org.apache.spark.sql.delta.catalog.DeltaCatalog

# Delta Connect: cầu nối để client sc:// gọi được API Delta, không chỉ SQL.
spark.connect.extensions.relation.classes    org.apache.spark.sql.connect.delta.DeltaRelationPlugin
spark.connect.extensions.command.classes     org.apache.spark.sql.connect.delta.DeltaCommandPlugin

# ── Kích thước executor ────────────────────────────────────────
# Mỗi worker có 2 core → mỗi worker đẻ ĐÚNG 1 executor 2 core.
# Tổng cộng: 2 executor, 4 task chạy song song. Con số nhỏ là cố ý —
# đủ để shuffle phải đi qua network thật, và đủ nhỏ để nhìn thấy
# một task lệch (skew) treo trong khi ba task kia đã rảnh.
#
# NGÂN SÁCH RAM — con số này bị chặn bởi Docker Desktop, không phải bởi máy.
# Máy có 32GB nhưng Docker VM mặc định chỉ được cấp ~8GB. Đặt 2 executor × 3g
# + driver 2g = 8g là vượt trần, và kernel giết executor bằng SIGKILL:
# trong log hiện "exited with code 137", còn Spark chỉ báo một lỗi rất khó hiểu
# là "MetadataFetchFailedException: Missing an output location for shuffle".
# Đó là một sự cố production kinh điển — lỗi hiện ra ở tầng shuffle, nhưng
# nguyên nhân nằm ở tầng hệ điều hành.
#   2 × 2g + 1g = 5g, chừa chỗ cho Python worker, MinIO và Jupyter.
# Muốn chạy rộng tay hơn: Docker Desktop → Settings → Resources → Memory.
spark.executor.cores                         2
spark.executor.memory                        2g
spark.driver.memory                          1g

# ── Chừa chỗ cho bài học ───────────────────────────────────────
# 200 là mặc định của Spark — CỐ Ý không sửa. Với 4 core, 200 partition
# shuffle là quá nhiều; notebook Phase 3 sẽ tự đo rồi tự chỉnh.
spark.sql.shuffle.partitions                 200

# ── Phase 4: catalog — chỗ Spark ghi nhớ "có những bảng nào" ────
#
# Đến Phase 3, mọi thứ đều là ĐƯỜNG DẪN: spark.read.format("delta").load("s3a://...").
# Từ Phase 4, dbt cần gọi bảng bằng TÊN (`silver.trips`) và phải hỏi được
# "bảng này đã tồn tại chưa?" — nếu không, model incremental không thể có.
#
# Mặc định Spark dùng catalog `in-memory`: danh sách bảng sống trong RAM của
# driver và BỐC HƠI khi container spark-connect khởi động lại. Dữ liệu trên
# MinIO vẫn còn, nhưng không ai nhớ nó là bảng gì nữa.
#
# `hive` ở đây KHÔNG phải Hive engine (thứ đã chết từ lâu) mà là Hive
# *Metastore* — một schema SQL để lưu metadata bảng. Ta dùng bản nhúng, ghi
# vào Derby (CSDL Java một file) trên volume. Đây là ĐỒ TẠM, cố ý:
# Phase 6 sẽ thay bằng Unity Catalog, và chính lúc thay bạn mới thấy rõ
# Metastore thiếu gì mà UC có (phân quyền, lineage, ba tầng tên, đa engine).
spark.sql.catalogImplementation                  hive
spark.sql.warehouse.dir                          s3a://lakehouse/warehouse
spark.hadoop.javax.jdo.option.ConnectionURL      jdbc:derby:;databaseName=/opt/spark/metastore/metastore_db;create=true
spark.hadoop.hive.metastore.schema.verification  false
spark.hadoop.datanucleus.schema.autoCreateAll    true
