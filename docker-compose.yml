# ═══════════════════════════════════════════════════════════════
#  Databricks Clone — Phase 0: Lát cắt mỏng
#  Tầng 1 (Object storage) = MinIO   |   Tầng 7 (Notebook) = Jupyter
#  Sáu tầng còn lại sẽ được thêm dần qua các phase sau.
# ═══════════════════════════════════════════════════════════════

services:

  # ── Tầng 1: Object storage. Databricks gọi là DBFS, thực chất là S3. ──
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"      # S3 API — code nói chuyện qua cổng này
      - "${MINIO_CONSOLE_PORT}:9001"  # Web UI — người xem qua cổng này
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [lakehouse]

  # ── Tạo bucket rồi tự thoát. Chạy một lần, không phải service thường trực. ──
  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo '✓ Bucket sẵn sàng: '$$MINIO_BUCKET
      "
    networks: [lakehouse]


  # ═══════════════════════════════════════════════════════════════
  #  Tầng 4: Catalog. Phase 4 dùng Derby NHÚNG trong JVM spark-connect —
  #  chỉ MỘT tiến trình mở được. Từ Phase 5, catalog tách thành service
  #  riêng (Hive Metastore, ghi vào Postgres) để Spark VÀ Trino cùng trỏ
  #  vào một chỗ. Đây là bản nháp của Unity Catalog ở Phase 6.
  # ═══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:17
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_METASTORE_DB}
      # Đọc bởi docker/postgres/init/01-create-superset-db.sh — chạy một
      # lần lúc volume postgres-data còn trống, tạo thêm DB thứ hai cho
      # Superset trong CÙNG một Postgres.
      POSTGRES_SUPERSET_DB: ${POSTGRES_SUPERSET_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [lakehouse]

  # ── Hive Metastore ĐỘC LẬP — thrift://:9083. Không phải Hive engine
  # (thứ đã chết), chỉ là một schema SQL lưu "bảng nào, cột gì, ở đâu".
  # Entrypoint gốc của ảnh tự chạy schematool -initOrUpgradeSchema mỗi lần
  # khởi động — idempotent, không cần bước init riêng như minio-init.
  hive-metastore:
    build: ./docker/hive-metastore
    image: lakehouse/hive-metastore:4.0.0
    container_name: lakehouse-hive-metastore
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/${POSTGRES_METASTORE_DB}
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD}
      # Đọc bởi core-site.xml (${env.VAR}) — metastore tự validate LOCATION
      # s3a://... của bảng/database nên cũng cần thấy MinIO, không chỉ Spark.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${HIVE_METASTORE_PORT}:9083"
    healthcheck:
      # Chưa có curl/nc trong ảnh — /dev/tcp là built-in của bash, đủ để
      # biết cổng Thrift đã mở hay chưa.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [lakehouse]

  # ═══════════════════════════════════════════════════════════════
  #  Tầng 3: Compute engine. Databricks gọi là "Databricks Runtime".
  #  Bốn container dưới đây dùng CHUNG một image (docker/spark).
  #  Vai trò khác nhau hoàn toàn do `command`, không do image.
  # ═══════════════════════════════════════════════════════════════

  # ── Bộ não điều phối. Không tính toán gì cả — chỉ chia việc. ──
  spark-master:
    build: ./docker/spark
    image: lakehouse/spark:4.1.3
    container_name: lakehouse-spark-master
    command: /opt/spark/sbin/spark-daemon.sh start org.apache.spark.deploy.master.Master 1 --host spark-master --port 7077 --webui-port 8080
    environment: &spark-env
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"   # UI: xem worker nào còn sống, app nào đang chạy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [lakehouse]

  # ── Nơi tính toán thật. Executor sinh ra bên trong worker. ──
  # Hai worker chứ không phải một: để shuffle buộc phải đi qua network
  # giữa hai JVM khác nhau, đúng như cluster thật. Một worker thì shuffle
  # chỉ là chép file trong cùng tiến trình — không học được gì.
  spark-worker-1:
    build: ./docker/spark
    image: lakehouse/spark:4.1.3
    container_name: lakehouse-spark-worker-1
    depends_on:
      spark-master: { condition: service_healthy }
    command: /opt/spark/sbin/spark-daemon.sh start org.apache.spark.deploy.worker.Worker 1 --webui-port 8081 spark://spark-master:7077
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
    networks: [lakehouse]

  spark-worker-2:
    build: ./docker/spark
    image: lakehouse/spark:4.1.3
    container_name: lakehouse-spark-worker-2
    depends_on:
      spark-master: { condition: service_healthy }
    command: /opt/spark/sbin/spark-daemon.sh start org.apache.spark.deploy.worker.Worker 2 --webui-port 8081 spark://spark-master:7077
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
    networks: [lakehouse]

  # ── DRIVER. Đây là container quan trọng nhất để hiểu Phase 3. ──
  # Notebook KHÔNG chứa driver. Driver sống ở đây, thường trực, và nhận
  # lệnh từ xa qua gRPC (giao thức sc://). Đó chính là mô hình
  # Databricks Connect: notebook chỉ là bàn phím, bộ não ở chỗ khác.
  spark-connect:
    build: ./docker/spark
    image: lakehouse/spark:4.1.3
    container_name: lakehouse-spark-connect
    depends_on:
      spark-worker-1: { condition: service_started }
      spark-worker-2: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
      hive-metastore: { condition: service_healthy }
    command: >
      /opt/spark/sbin/start-connect-server.sh
      --master spark://spark-master:7077
      --conf spark.driver.host=spark-connect
      --conf spark.connect.grpc.binding.port=15002
      --conf spark.ui.port=4040
    environment: *spark-env
    ports:
      - "${SPARK_CONNECT_PORT}:15002"   # gRPC: notebook nối vào bằng cổng này
      - "${SPARK_APP_UI_PORT}:4040"     # Spark UI — cổng quan trọng nhất Phase 3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4040 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [lakehouse]

  # ── Tầng 7: Notebook. Nơi bạn thực sự chạm vào dữ liệu. ──
  jupyter:
    build: ./docker/jupyter
    container_name: lakehouse-jupyter
    depends_on:
      minio-init: { condition: service_completed_successfully }
      spark-connect: { condition: service_healthy }
      trino: { condition: service_healthy }
    environment:
      # Biến chuẩn AWS — boto3/s3fs/duckdb đều tự đọc, không cần hardcode key trong code
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_REGION: us-east-1
      LAKEHOUSE_BUCKET: ${MINIO_BUCKET}
      # Notebook đọc biến này để biết nối vào đâu — không hardcode trong cell
      SPARK_REMOTE: sc://spark-connect:15002
      # Phase 5 — cổng HTTP thuần, không gRPC, không JVM. Trong container dùng
      # tên service; một analyst thật ngồi ngoài máy sẽ dùng localhost:${TRINO_PORT}.
      TRINO_HOST: trino
      TRINO_PORT: "8080"
    ports:
      - "${JUPYTER_PORT}:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
      # Phase 4: notebook đọc được mã nguồn dbt và SQL đã biên dịch trong
      # target/. Chỉ ĐỌC — dbt chạy ở container riêng, notebook không sửa gì.
      - ./dbt:/home/jovyan/dbt:ro
    command: >
      start-notebook.py
      --IdentityProvider.token='${JUPYTER_TOKEN}'
      --ServerApp.root_dir=/home/jovyan/work
    networks: [lakehouse]

  # ═══════════════════════════════════════════════════════════════
  #  Tầng 6: Transform. Databricks gọi tầng này là Workflows / DLT.
  #  Phase 7 sẽ thêm Airflow bên cạnh — dbt lo "biến đổi thế nào",
  #  Airflow lo "chạy lúc nào, theo thứ tự nào". Hai việc khác nhau.
  # ═══════════════════════════════════════════════════════════════
  dbt:
    build: ./docker/dbt
    image: lakehouse/dbt:1.12.3
    container_name: lakehouse-dbt
    depends_on:
      spark-connect: { condition: service_healthy }
    environment:
      # Cùng một biến notebook dùng ở Phase 3. dbt và notebook nói chuyện với
      # ĐÚNG một driver, nên bảng bên này tạo là bên kia thấy ngay.
      SPARK_REMOTE: sc://spark-connect:15002
      LAKEHOUSE_BUCKET: ${MINIO_BUCKET}
      DBT_PROFILES_DIR: /dbt
    volumes:
      - ./dbt:/dbt
      - ./scripts:/scripts:ro
    ports:
      - "${DBT_DOCS_PORT}:8081"    # `make dbt-docs` — sơ đồ lineage của cả pipeline
    networks: [lakehouse]

  # ═══════════════════════════════════════════════════════════════
  #  Tầng 5: SQL warehouse. Databricks gọi là "SQL Warehouse (Photon)".
  #  Trino KHÔNG tính toán qua Spark — nó là engine SQL riêng, đọc thẳng
  #  Delta transaction log (connector delta_lake), chỉ mượn Hive Metastore
  #  để biết bảng nằm ở đâu. Đây là ý nghĩa thật của "Delta là định dạng
  #  mở": ba engine khác nhau (delta-rs, Spark, Trino) cùng đọc một bộ
  #  file, không engine nào sở hữu riêng.
  # ═══════════════════════════════════════════════════════════════
  trino:
    image: trinodb/trino:476
    container_name: lakehouse-trino
    depends_on:
      hive-metastore: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./docker/trino/etc:/etc/trino:ro
    ports:
      - "${TRINO_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [lakehouse]

  # ═══════════════════════════════════════════════════════════════
  #  Tầng 7 (nhánh BI): Databricks Dashboards. Nơi analyst thật sự dùng —
  #  không viết SQL tay, chỉ kéo-thả trên bảng Trino đã phơi ra ở trên.
  # ═══════════════════════════════════════════════════════════════

  # ── Chạy một lần rồi thoát, giống minio-init: dựng schema metadata,
  # tạo tài khoản admin, đồng bộ role mặc định. Idempotent khi restart —
  # create-admin bọc trong ngoặc () || true để không chặn lần chạy sau. ──
  superset-init:
    build: ./docker/superset
    image: lakehouse/superset:4.1.1
    container_name: lakehouse-superset-init
    depends_on:
      postgres: { condition: service_healthy }
    environment: &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SUPERSET_DB: ${POSTGRES_SUPERSET_DB}
    # entrypoint dạng LIST (exec form), toàn bộ script gói trong MỘT chuỗi
    # không xuống dòng. Từng thử viết nhiều dòng bằng `entrypoint: >` — YAML
    # folded scalar chỉ gộp dòng thành dấu cách khi mọi dòng THẲNG HÀNG; dòng
    # thụt sâu hơn (như --username ở dưới create-admin) bị giữ nguyên xuống
    # dòng, biến mỗi --flag thành một LỆNH SHELL riêng và vỡ hoàn toàn.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        superset db upgrade &&
        (superset fab create-admin --username ${SUPERSET_ADMIN_USER} --firstname Admin --lastname User --email ${SUPERSET_ADMIN_EMAIL} --password ${SUPERSET_ADMIN_PASSWORD} || true) &&
        superset init &&
        echo 'Superset khoi tao xong'
    networks: [lakehouse]

  superset:
    build: ./docker/superset
    image: lakehouse/superset:4.1.1
    container_name: lakehouse-superset
    depends_on:
      superset-init: { condition: service_completed_successfully }
      trino: { condition: service_healthy }
    environment: *superset-env
    ports:
      - "${SUPERSET_PORT}:8088"
    networks: [lakehouse]

volumes:
  minio-data:
  postgres-data:

networks:
  lakehouse:
    name: lakehouse
