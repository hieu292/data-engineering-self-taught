# ═══════════════════════════════════════════════════════════════
#  Catalog "delta" — connector delta_lake, KHÔNG phải connector hive.
#
#  Bảng trong lakehouse này đều là Delta (xem dbt_project.yml: +file_format
#  delta trên mọi model). delta_lake connector đọc thẳng _delta_log/ —
#  đúng transaction log mà Spark và delta-rs đã đọc từ Phase 2 — nó chỉ
#  mượn Hive Metastore để biết "bảng X nằm ở đường dẫn nào", không dùng
#  Metastore để hiểu schema hay validate file.
#
#  Tên file này (delta.properties) chính là tên catalog. Vì thế truy vấn
#  trong Trino có dạng ba tầng: delta.silver.silver_trips — giống hệt
#  catalog.schema.table mà Unity Catalog dùng ở Phase 6.
# ═══════════════════════════════════════════════════════════════
connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083

# ── Nói chuyện với MinIO — cùng bài học S3A của Phase 3, khác API (Trino
# có filesystem riêng, không đi qua Hadoop s3a://). ────────────────────
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true

# ${ENV:...} — Trino thay bằng biến môi trường của chính tiến trình Trino
# lúc đọc file này. Không hardcode key, không phải bí mật nằm trong git.
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
