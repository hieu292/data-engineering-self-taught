# Node dev: coordinator TỰ nhận luôn việc thực thi (node-scheduler.include-coordinator),
# thay vì đợi worker riêng. Production thật tách hẳn hai vai để coordinator
# không bị nghẽn CPU khi cluster tải cao.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
