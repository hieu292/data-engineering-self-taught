# Một node duy nhất đóng cả hai vai: coordinator (nhận query, lập kế hoạch)
# và worker (thực thi). Cluster Trino thật tách hai vai này ra nhiều máy —
# ở đây gộp lại vì mục tiêu là học SQL layer, không phải học scale-out Trino.
node.environment=dev
node.id=trino-coordinator
node.data-dir=/data/trino
